name: FW14 audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository audit
        run: python3 scripts/audit_fw14.py --output fw14-audit-report.txt
      - name: Run audit tests
        run: python3 -m unittest discover -s tests -v
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fw14-audit-report
          path: fw14-audit-report.txt
          if-no-files-found: error
